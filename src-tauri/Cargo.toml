[package]
name = "context-capsule-desktop"
version = "0.1.0"
description = "Tray-first desktop control surface for Context Capsule"
authors = ["Context Capsule"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "context_capsule_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
