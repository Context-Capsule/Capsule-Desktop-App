name: Windows Desktop

on:
  push:
    branches:
      - feature/tauri-desktop-app-20260830
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure stable Rust toolchain
        shell: pwsh
        run: |
          Get-Command rustup -ErrorAction Stop | Format-List Source
          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded save resilience source patch
        run: node scripts/apply-save-resilience-patch.mjs

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate application icons
        run: npm run icons:generate

      - name: Validate Windows branding preparation
        shell: pwsh
        run: |
          # Use an icon generated in this clean checkout as the explicit source.
          # This tests the same local Tauri JS invocation and path-with-spaces
          # behavior as production without requiring another private repository.
          $env:CAPSULE_BRAND_ASSET = Join-Path $PWD 'src-tauri\icons\icon.png'
          npm run brand:prepare

      - name: Source and packaging contract tests
        run: npm test

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Frontend production build
        run: npm run build

      - name: Capture true 340x440 quick-window visual fixtures
        run: node scripts/capture-quick-fixtures.mjs

      - name: Upload quick-window visual fixtures
        uses: actions/upload-artifact@v4
        with:
          name: quick-window-visuals
          path: screenshots/quick/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Capture functional full-app Save nested scrolling
        run: node scripts/capture-full-save-scroll.mjs

      - name: Upload full-app Save scroll fixtures
        uses: actions/upload-artifact@v4
        with:
          name: full-save-scroll-visuals
          path: screenshots/full/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Prepare non-production CI sidecar placeholders
        shell: pwsh
        run: |
          $triple = rustc --print host-tuple
          if ($LASTEXITCODE -ne 0 -or -not $triple) {
            $host = rustc -Vv | Select-String '^host:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() }
            $triple = $host
          }
          if (-not $triple) { throw 'Could not determine Rust target triple' }
          $dir = Join-Path $PWD 'src-tauri\binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('capsule','capsule-agent-worker','capsule-firefox-host','capsule-chrome-host')) {
            # These placeholders exist only so tauri-build can validate its externalBin configuration.
            # They are never uploaded or treated as a production installer/runtime.
            Set-Content -NoNewline -Path (Join-Path $dir "$name-$triple.exe") -Value 'CI packaging placeholder'
          }

      - name: Rust format
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri\Cargo.toml -- --check

      - name: Tauri backend tests
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Tauri backend check
        run: cargo check --manifest-path src-tauri\Cargo.toml --all-targets

      - name: Compile Tauri application without bundling placeholders
        run: npm run tauri -- build --no-bundle

      - name: Publish validated save resilience patch
        shell: pwsh
        run: |
          git checkout HEAD^ -- .github/workflows/windows-desktop.yml
          git rm scripts/apply-save-resilience-patch.mjs
          git add src/components/QuickPanel.svelte src/components/FullApp.svelte src-tauri/src/lib.rs tests/save-integration.test.mjs .github/workflows/windows-desktop.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git config user.name 'GPT Slave'
          git config user.email 'unknown.entiti911@gmail.com'
          git commit -m 'fix: harden service saves and full dialog scrolling'
          if ($LASTEXITCODE -ne 0) { throw 'validated product commit failed' }
          git push origin HEAD:feature/tauri-desktop-app-20260830
          if ($LASTEXITCODE -ne 0) { throw 'validated product push failed' }

      - name: Explain runtime boundary
        shell: pwsh
        run: |
          Write-Host 'Desktop native/frontend validation passed.'
          Write-Host 'Quick-window screenshots use Chromium DevTools device-metrics emulation at exactly 340x440 CSS pixels and assert every shell remains inside the viewport.'
          Write-Host 'Full-app Save validation uses an exact 1100x760 CSS viewport, verifies both the application chooser and outer dialog really overflow, programmatically scrolls both, and confirms their scrollbars stay hidden.'
          Write-Host 'They are browser-rendered CSS fixtures, not WebView2/native-window screenshots.'
          Write-Host 'This workflow intentionally does not manufacture a production installer with placeholder sidecars.'
          Write-Host 'Production packaging requires real release binaries from Capsule-CLI: capsule, agent worker, Firefox/Zen host, and Chrome host.'