name: Bootstrap and Validate Desktop Source

on:
  push:
    branches:
      - feature/tauri-desktop-app-20260830
    paths:
      - '.github/workflows/bootstrap-desktop.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') {
            throw "Expected runner POTUS, got '${{ runner.name }}'"
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct locally-tested source tree
        shell: pwsh
        run: |
          $parts = 0..4 | ForEach-Object {
            $name = 'desktop-source-v2.part{0:D2}' -f $_
            if (-not (Test-Path $name)) { throw "Missing staged source chunk: $name" }
            Get-Content -Raw $name
          }
          $encoded = $parts -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          $archive = Join-Path $env:RUNNER_TEMP 'context-capsule-desktop-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, $bytes)
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '755adb4286f67fc409120582dc61f95a7e81973428814a6f322e1fd610dd4185'
          if ($hash -ne $expected) {
            throw "Desktop source archive hash mismatch: expected $expected, got $hash"
          }

          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          tar -xzf $archive -C $PWD
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract desktop source archive' }

          # POTUS run #1 proved the packaging fixture was Unix-only: production
          # code correctly expects .exe on Windows, while the fake test files did
          # not add that suffix. Apply the locally-validated cross-platform
          # fixture before running the native gate; this becomes part of the
          # final source commit if every validation stage succeeds.
          $fixture = @'
import test from 'node:test';
import assert from 'node:assert/strict';
import { mkdtemp, writeFile, readFile, rm, unlink } from 'node:fs/promises';
import { tmpdir } from 'node:os';
import { join, resolve } from 'node:path';
import { spawnSync } from 'node:child_process';

const root = resolve(import.meta.dirname, '..');
const names = ['capsule', 'capsule-agent-worker', 'capsule-firefox-host', 'capsule-chrome-host'];
const triple = 'x86_64-context-capsule-test';
const exe = process.platform === 'win32' ? '.exe' : '';

test('sidecar preparation copies all required binaries byte-for-byte', async () => {
  const dir = await mkdtemp(join(tmpdir(), 'context-capsule-sidecars-'));
  const outputs = names.map((name) => resolve(root, 'src-tauri', 'binaries', `${name}-${triple}${exe}`));
  try {
    for (const name of names) await writeFile(join(dir, `${name}${exe}`), `binary:${name}\n`);
    const result = spawnSync(process.execPath, ['scripts/prepare-sidecar.mjs'], {
      cwd: root,
      encoding: 'utf8',
      env: { ...process.env, CAPSULE_CLI_BIN: join(dir, `capsule${exe}`), CAPSULE_TARGET_TRIPLE: triple }
    });
    assert.equal(result.status, 0, result.stderr || result.stdout);
    for (const [index, name] of names.entries()) {
      assert.equal(await readFile(outputs[index], 'utf8'), `binary:${name}\n`);
    }
  } finally {
    await Promise.all(outputs.map((path) => unlink(path).catch(() => undefined)));
    await rm(dir, { recursive: true, force: true });
  }
});

test('sidecar preparation refuses a partial CLI build', async () => {
  const dir = await mkdtemp(join(tmpdir(), 'context-capsule-sidecars-incomplete-'));
  try {
    await writeFile(join(dir, `capsule${exe}`), 'only-capsule');
    const result = spawnSync(process.execPath, ['scripts/prepare-sidecar.mjs'], {
      cwd: root,
      encoding: 'utf8',
      env: { ...process.env, CAPSULE_CLI_BIN: join(dir, `capsule${exe}`), CAPSULE_TARGET_TRIPLE: triple }
    });
    assert.notEqual(result.status, 0);
    assert.match(`${result.stderr}\n${result.stdout}`, /Required release binary is missing/);
  } finally {
    await rm(dir, { recursive: true, force: true });
  }
});
'@
          Set-Content -Path 'tests\sidecar-prepare.test.mjs' -Value $fixture -NoNewline

          foreach ($required in @(
            'package.json',
            'src\App.svelte',
            'src-tauri\Cargo.toml',
            'src-tauri\src\lib.rs',
            '.github\workflows\windows-desktop.yml'
          )) {
            if (-not (Test-Path $required)) { throw "Reconstructed source is missing $required" }
          }
          if (Test-Path '.github\workflows\bootstrap-desktop.yml') {
            throw 'Final source must not retain the one-shot bootstrap workflow'
          }

      - name: Ensure stable Rust toolchain
        shell: pwsh
        run: |
          Get-Command rustup -ErrorAction Stop | Format-List Source
          rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup stable install failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'rustup default stable failed' }
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate application icons
        run: npm run icons:generate

      - name: Source and packaging contract tests
        id: contracts
        continue-on-error: true
        run: npm test

      - name: Svelte and TypeScript checks
        id: svelte_check
        continue-on-error: true
        run: npm run check

      - name: Frontend production build
        id: frontend_build
        continue-on-error: true
        run: npm run build

      - name: Prepare non-production CI sidecar placeholders
        shell: pwsh
        run: |
          $triple = rustc --print host-tuple 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $triple) {
            $triple = rustc -Vv | Select-String '^host:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() }
          }
          if (-not $triple) { throw 'Could not determine Rust target triple' }
          $dir = Join-Path $PWD 'src-tauri\binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('capsule','capsule-agent-worker','capsule-firefox-host','capsule-chrome-host')) {
            Set-Content -NoNewline -Path (Join-Path $dir "$name-$triple.exe") -Value 'CI packaging placeholder'
          }

      - name: Rust format
        id: rust_fmt
        continue-on-error: true
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri\Cargo.toml -- --check

      - name: Tauri backend tests
        id: rust_test
        continue-on-error: true
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Tauri backend check
        id: rust_check
        continue-on-error: true
        run: cargo check --manifest-path src-tauri\Cargo.toml --all-targets

      - name: Compile Tauri application without bundling placeholder sidecars
        id: tauri_build
        continue-on-error: true
        run: npm run tauri -- build --no-bundle

      - name: Require every validation stage to pass
        shell: pwsh
        run: |
          $results = @{
            contracts = '${{ steps.contracts.outcome }}'
            svelte_check = '${{ steps.svelte_check.outcome }}'
            frontend_build = '${{ steps.frontend_build.outcome }}'
            rust_fmt = '${{ steps.rust_fmt.outcome }}'
            rust_test = '${{ steps.rust_test.outcome }}'
            rust_check = '${{ steps.rust_check.outcome }}'
            tauri_build = '${{ steps.tauri_build.outcome }}'
          }
          $failed = $results.GetEnumerator() | Where-Object { $_.Value -ne 'success' }
          $results.GetEnumerator() | Sort-Object Name | Format-Table -AutoSize
          if ($failed) {
            throw "Native desktop validation failed: $($failed.Name -join ', ')"
          }

      - name: Commit validated source tree without scheduling another CI run
        shell: pwsh
        run: |
          git config user.name 'context-capsule-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Validated source reconstruction produced no repository changes' }
          git commit -m 'feat: implement Tauri desktop app [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit validated desktop source' }
          git push origin HEAD:${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { throw 'Could not push validated desktop source' }
          Write-Host 'Validated desktop source was pushed. [skip ci] prevents a duplicate native run.'
