<!doctype html><html><head><meta charset="utf-8"><title>Context Capsule Quick Panel Preview</title><link rel="stylesheet" href="../../src/app.css"><style>html,body{width:430px;height:620px;background:#050605} liquid-glass{display:block;border-radius:30px}.fake-icon{font-size:15px}.capsule-card-shell liquid-glass{height:100%;border-radius:20px}.quick-panel{border-radius:30px}.quick-capsules{overflow:hidden}.quick-footer{margin-top:auto}</style></head><body>
<div class="quick-root"><liquid-glass class="glass"><div class="quick-panel">
<header class="quick-header"><div class="brand-lockup"><div class="brand-mark">✦</div><div><strong>Context Capsule</strong><span>Workspace memory</span></div></div><div class="status-pill ready"><span class="status-orb"></span><span>Ready</span></div></header>
<button class="save-hero"><span class="save-icon">＋</span><span><strong>Save Capsule</strong><small>Capture your current workspace</small></span><span>↗</span></button>
<div class="quick-section-heading"><div><span class="section-kicker">Recent Capsules</span><strong>4 saved</strong></div><button class="icon-button subtle">↻</button></div>
<div class="quick-capsules">
<div class="capsule-card-shell compact"><liquid-glass class="glass glass-interactive"><div class="capsule-card"><button class="capsule-main"><div class="capsule-icon">◇</div><div class="capsule-copy"><div class="capsule-title-row"><strong>Dino Game</strong><span class="version">v13</span></div><span class="metrics">8 apps · 14 tabs · 3 terminals · 1 service</span></div></button><div class="capsule-side"><span class="time">2m ago</span><div class="card-actions"><button class="restore-button">↻ <span>Restore</span> ›</button></div></div></div></liquid-glass></div>
<div class="capsule-card-shell compact"><liquid-glass class="glass glass-interactive"><div class="capsule-card"><button class="capsule-main"><div class="capsule-icon">◇</div><div class="capsule-copy"><div class="capsule-title-row"><strong>Tri-Up Platform</strong><span class="version">v7</span></div><span class="metrics">6 apps · 12 tabs · 2 terminals · 2 services</span></div></button><div class="capsule-side"><span class="time">3h ago</span><div class="card-actions"><button class="restore-button">↻ <span>Restore</span> ›</button></div></div></div></liquid-glass></div>
<div class="capsule-card-shell compact"><liquid-glass class="glass glass-interactive"><div class="capsule-card"><button class="capsule-main"><div class="capsule-icon">◇</div><div class="capsule-copy"><div class="capsule-title-row"><strong>Context Capsule</strong><span class="version">v4</span></div><span class="metrics">5 apps · 9 tabs · 4 terminals</span></div></button><div class="capsule-side"><span class="time">Yesterday</span><div class="card-actions"><button class="restore-button">↻ <span>Restore</span> ›</button></div></div></div></liquid-glass></div>
</div>
<footer class="quick-footer"><button>◉ Workspace</button><button>♡ Health</button><button>⚙ Settings</button><button class="open-full">↗</button></footer>
</div></liquid-glass></div></body></html>
