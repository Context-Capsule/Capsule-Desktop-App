<!doctype html><html><head><meta charset="utf-8"><title>Context Capsule Quick Panel Preview</title><link rel="stylesheet" href="../../src/app.css"><link rel="stylesheet" href="../../src/glass-overrides.css"><style>html{width:340px;height:440px;background:linear-gradient(135deg,#33404d,#111820 42%,#4b3040);background-size:cover}body{width:340px;height:440px;background:transparent} liquid-glass{display:block;border-radius:24px}.fake-icon{font-size:12px}.capsule-card-shell liquid-glass{height:100%;border-radius:18px}.quick-panel{border-radius:24px}.quick-capsules{overflow:hidden}.quick-footer{margin-top:auto}.brand-mark{width:26px;height:26px}</style></head><body>

<div class="capsule-card-shell compact"><liquid-glass class="glass glass-interactive"><div class="capsule-card"><button class="capsule-main"><div class="capsule-icon">◇</div><div class="capsule-copy"><div class="capsule-title-row"><strong>Tri-Up</strong><span class="version">v7</span></div><span class="metrics">6 apps · 12 tabs · 2 terminals</span></div></button><div class="capsule-side"><span class="time">3h ago</span><div class="card-actions"><button class="restore-button">↻ <span>Restore</span> ›</button></div></div></div></liquid-glass></div>
<div class="capsule-card-shell compact"><liquid-glass class="glass glass-interactive"><div class="capsule-card"><button class="capsule-main"><div class="capsule-icon">◇</div><div class="capsule-copy"><div class="capsule-title-row"><strong>Capsule CLI</strong><span class="version">v4</span></div><span class="metrics">5 apps · 9 tabs · 4 terminals</span></div></button><div class="capsule-side"><span class="time">Yesterday</span><div class="card-actions"><button class="restore-button">↻ <span>Restore</span> ›</button></div></div></div></liquid-glass></div>
</div>

</div></liquid-glass></div></body></html>
